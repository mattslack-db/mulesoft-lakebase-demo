# MuleSoft Lakebase Demo - JDBC App configuration (committed)
#
# Non-secret values are stored here. The client secret is read from the
# DATABRICKS_CLIENT_SECRET environment variable at runtime (Mule resolves
# system/env properties inside YAML string values).
#
# Key layout matches property references in jdbc.xml:
#   ${pg.host}                      - Lakebase PostgreSQL hostname
#   ${pg.database}                  - Lakebase database name
#   ${pg.user}                      - Postgres role (SP client ID UUID)
#   ${pg.bootstrap.token}           - Fallback token used before first scheduled refresh
#                                     (SPIKE placeholder; p('pg.bootstrap.token') in db:config)
#   ${lakebase.endpointPath}        - Lakebase endpoint path for credential minting
#   ${databricks.host}              - Databricks workspace hostname (OAuth token URL base)
#   ${databricks.client.id}         - Service principal client ID (OAuth M2M, non-secret)
#   ${databricks.client.secret}     - Resolved from DATABRICKS_CLIENT_SECRET env var (never committed)

pg:
  host: "<PG_HOST>"
  database: "databricks_postgres"
  user: "<SP_CLIENT_ID>"
  bootstrap:
    token: "<leave-blank: populated-at-runtime-by-refresh-flow-phase2-spike>"

lakebase:
  endpointPath: "projects/mulesoft-lakebase-demo/branches/production/endpoints/primary"

databricks:
  host: "<WORKSPACE_HOST>"
  client:
    id: "<SP_CLIENT_ID>"
    secret: "${DATABRICKS_CLIENT_SECRET}"
