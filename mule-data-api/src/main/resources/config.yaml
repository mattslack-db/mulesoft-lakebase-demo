# MuleSoft Lakebase Demo — Data API App configuration (committed)
#
# Non-secret values are stored here. The client secret is read from the
# DATABRICKS_CLIENT_SECRET environment variable at runtime (Mule resolves
# system/env properties inside YAML string values).
#
# Key layout matches property references in data-api.xml:
#   ${dataapi.host}             — Lakebase Data API hostname
#   ${dataapi.basePath}         — Data API path prefix (workspace + database path)
#   ${databricks.host}          — Databricks workspace hostname (for OAuth token URL)
#   ${databricks.client.id}     — Service principal client ID (OAuth M2M, non-secret)
#   ${databricks.client.secret} — Resolved from DATABRICKS_CLIENT_SECRET env var (never committed)

dataapi:
  host: "ep-round-haze-d1ur4ljy.database.us-west-2.cloud.databricks.com"
  basePath: "/api/2.0/workspace/7474647152304469/rest/databricks_postgres"

databricks:
  host: "fe-sandbox-mulesoft-lakebase-demo.cloud.databricks.com"
  client:
    id: "7a31531d-df0c-484f-af00-acd8a4f4e461"
    secret: "${DATABRICKS_CLIENT_SECRET}"
